<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TermFleet-SSH</title>
    <script>
      try {
        if (window.localStorage.getItem('wssh-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (error) {
        // Keep the default light theme when browser storage is unavailable.
      }
    </script>
    <link href="static/img/favicon.png" rel="icon" type="image/png">
    <link href="static/css/xterm.min.css" rel="stylesheet" type="text/css">
    <link href="static/css/fullscreen.min.css" rel="stylesheet" type="text/css">
    <!-- Web fonts are progressive enhancement; system fonts are used if offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Optional custom font served by the backend (offline friendly). */
      {% if font.family %}
      @font-face {
        font-family: '{{ font.family }}';
        src: url('{{ font.url }}');
      }
      :root {
        --mono: '{{ font.family }}', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      {% end %}

      :root {
        color-scheme: light;
        --bg-top: #ffffff;
        --bg-mid: #f4f6fb;
        --bg-bottom: #e9edf6;
        --bg-primary-glow: rgba(79, 70, 229, 0.1);
        --bg-accent-glow: rgba(22, 163, 74, 0.08);
        --panel: rgba(255, 255, 255, 0.9);
        --panel-solid: #ffffff;
        --panel-soft: #f1f5f9;
        --ink: #0f172a;
        --ink-soft: #334155;
        --muted: #475569;
        --faint: #64748b;
        --line: #dce3ef;
        --line-strong: #cbd5e1;
        --primary: #4f46e5;
        --primary-rgb: 79, 70, 229;
        --primary-strong: #3730a3;
        --primary-tint: #eef2ff;
        --accent: #16a34a;
        --accent-strong: #15803d;
        --accent-tint: #ecfdf5;
        --danger: #dc2626;
        --danger-tint: #fef2f2;
        --warn: #d97706;
        --on-primary: #ffffff;
        --on-accent: #ffffff;
        --on-danger: #ffffff;
        --primary-hover-line: #c7d2fe;
        --danger-line: #fecaca;
        --rail-bg: rgba(255, 255, 255, 0.94);
        --group-bg: rgba(255, 255, 255, 0.72);
        --group-fullscreen-bg: rgba(255, 255, 255, 0.92);
        --empty-bg: rgba(248, 250, 252, 0.7);
        --selected-bg: #eff6ff;
        --selected-line: #93c5fd;
        --segment-bg: #f1f5f9;
        --segment-line: #dbe3ee;
        --segment-ink: #64748b;
        --segment-hover-bg: rgba(255, 255, 255, 0.56);
        --segment-hover-ink: #334155;
        --segment-active-bg: #ffffff;
        --segment-active-ink: #0f172a;
        --segment-active-line: #e2e8f0;
        --segment-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
        --brand-end: #6366f1;
        --terminal: #0a0f1f;
        --terminal-head: #0f1729;
        --terminal-line: #1e293b;
        --terminal-ink: #dbeafe;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.1);
        --shadow-lg: 0 24px 60px rgba(2, 6, 23, 0.22);
        --sans: "Fira Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        /* z-index scale: base 1, sidebar 20, topbar 30, drag 40, overlay 50, toast 60 */
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-top: #0b1220;
        --bg-mid: #080e1a;
        --bg-bottom: #050914;
        --bg-primary-glow: rgba(56, 189, 248, 0.1);
        --bg-accent-glow: rgba(59, 130, 246, 0.08);
        --panel: rgba(15, 23, 41, 0.94);
        --panel-solid: #111827;
        --panel-soft: #182235;
        --ink: #e5edf8;
        --ink-soft: #cbd5e1;
        --muted: #a8b6c8;
        --faint: #7d8da3;
        --line: #25324a;
        --line-strong: #3b4a63;
        --primary: #60a5fa;
        --primary-rgb: 96, 165, 250;
        --primary-strong: #93c5fd;
        --primary-tint: #172554;
        --accent: #34d399;
        --accent-strong: #6ee7b7;
        --accent-tint: #12392f;
        --danger: #dc2626;
        --danger-tint: #3b1820;
        --warn: #d97706;
        --on-primary: #07111f;
        --on-accent: #062117;
        --on-danger: #ffffff;
        --primary-hover-line: #3b82f6;
        --danger-line: #7f1d1d;
        --rail-bg: rgba(15, 23, 41, 0.97);
        --group-bg: rgba(15, 23, 41, 0.88);
        --group-fullscreen-bg: rgba(15, 23, 41, 0.97);
        --empty-bg: rgba(7, 11, 22, 0.64);
        --selected-bg: #172554;
        --selected-line: #3b82f6;
        --segment-bg: #0a0f1f;
        --segment-line: #26344a;
        --segment-ink: #94a3b8;
        --segment-hover-bg: rgba(96, 165, 250, 0.08);
        --segment-hover-ink: #dbeafe;
        --segment-active-bg: #1e293b;
        --segment-active-ink: #f8fafc;
        --segment-active-line: #3b82f6;
        --segment-shadow: 0 1px 3px rgba(0, 0, 0, 0.32);
        --brand-end: #2563eb;
        --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.24);
        --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.32);
        --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.46);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(1200px 520px at 12% -8%, var(--bg-primary-glow), transparent 60%),
          radial-gradient(1000px 480px at 108% 4%, var(--bg-accent-glow), transparent 55%),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 46%, var(--bg-bottom) 100%);
        background-attachment: fixed;
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        transition: color 180ms ease, background-color 180ms ease;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      :focus-visible {
        outline: 3px solid rgba(var(--primary-rgb), 0.32);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .skip-link {
        position: absolute;
        top: -56px;
        left: 16px;
        z-index: 60;
        padding: 10px 14px;
        color: var(--on-primary);
        background: var(--primary);
        border-radius: var(--radius-sm);
        transition: top 180ms ease;
      }

      .skip-link:focus {
        top: 16px;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        position: relative;
        height: 100vh;
        height: 100dvh;
        padding: 14px;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        position: absolute;
        inset: 0 14px auto;
        z-index: 30;
        height: 22px;
        overflow: visible;
      }

      .topbar-rail {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        width: 100%;
        padding: 0;
        place-items: start center;
        color: var(--primary);
        background: transparent;
        border: 0;
        transition: opacity 180ms ease, visibility 0s linear 0s;
      }

      .topbar-rail::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 92px;
        height: 22px;
        background: var(--rail-bg);
        border: 1px solid var(--line-strong);
        border-top: 0;
        border-radius: 0 0 9px 9px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
        transform: translateX(-50%);
        transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .topbar-rail svg {
        position: relative;
        z-index: 1;
        margin-top: 0;
        transition: transform 180ms ease;
      }

      .topbar-rail:hover::before {
        background: var(--primary-tint);
        border-color: var(--primary-hover-line);
        box-shadow: 0 10px 26px rgba(var(--primary-rgb), 0.16);
        transform: translateX(-50%) translateY(2px);
      }

      .topbar-rail:hover svg {
        transform: translateY(3px);
      }

      .topbar-rail:focus-visible {
        outline: none;
      }

      .topbar:hover .topbar-rail,
      .topbar:focus-within .topbar-rail {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 160ms ease, visibility 0s linear 160ms;
      }

      .topbar-panel {
        display: flex;
        position: absolute;
        inset: 22px 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-14px) scale(0.99);
        transform-origin: top center;
        transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 220ms;
      }

      .topbar:hover .topbar-panel,
      .topbar:focus-within .topbar-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0) scale(1);
        transition-delay: 0s;
      }

      .topbar:focus-within .topbar-panel {
        box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.24), var(--shadow-md);
      }

      .app-shell.panels-pinned .topbar {
        position: relative;
        inset: auto;
        flex: 0 0 auto;
        height: auto;
        margin-bottom: 14px;
      }

      .app-shell.panels-pinned .topbar-rail,
      .app-shell.panels-pinned .sidebar-rail {
        display: none;
      }

      .app-shell.panels-pinned .topbar-panel {
        position: relative;
        inset: auto;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        place-items: center;
        color: var(--on-primary);
        background: linear-gradient(135deg, var(--primary) 0%, var(--brand-end) 100%);
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.32);
      }

      .brand h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .brand p {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 999px;
        box-shadow: 0 0 0 4px var(--accent-tint);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .top-actions .btn-compact {
        min-width: 42px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        transition: background 180ms ease, border-color 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
      }

      .btn svg {
        flex: 0 0 auto;
      }

      .btn:hover {
        color: var(--primary-strong);
        background: var(--primary-tint);
        border-color: var(--primary-hover-line);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-primary {
        color: var(--on-primary);
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 8px 18px rgba(var(--primary-rgb), 0.28);
      }

      .btn-primary:hover {
        color: var(--on-primary);
        background: var(--primary-strong);
        border-color: var(--primary-strong);
      }

      .btn-accent {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 8px 18px rgba(22, 163, 74, 0.26);
      }

      .btn-accent:hover {
        color: var(--on-accent);
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }

      .btn-danger {
        color: var(--danger);
        background: var(--danger-tint);
        border-color: var(--danger-line);
      }

      .btn-danger:hover {
        color: var(--on-danger);
        background: var(--danger);
        border-color: var(--danger);
      }

      .btn-icon {
        width: 42px;
        padding: 0;
      }

      .btn-sm {
        min-height: 36px;
        padding: 0 10px;
        font-size: 13px;
      }

      .btn-lang {
        min-width: 74px;
      }

      .btn-theme svg {
        width: 19px;
        height: 19px;
      }

      /* ---------- Main body ---------- */
      .body {
        display: flex;
        position: relative;
        flex: 1;
        min-height: 0;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        display: flex;
        flex-direction: column;
        position: absolute;
        inset: 0 auto 0 0;
        width: 52px;
        background: transparent;
        overflow: visible;
        z-index: 20;
      }

      .sidebar-rail {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        width: 100%;
        padding: 0;
        place-items: center;
        color: var(--primary);
        background: transparent;
        border: 0;
        transition: opacity 180ms ease, visibility 0s linear 0s;
      }

      .sidebar-rail::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 22px;
        height: 92px;
        background: var(--rail-bg);
        border: 1px solid var(--line-strong);
        border-left: 0;
        border-radius: 0 9px 9px 0;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
        transform: translateY(-50%);
        transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .sidebar-rail svg {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 1;
        transform: translateY(-50%);
        transition: transform 180ms ease;
      }

      .sidebar-rail:hover::before {
        background: var(--primary-tint);
        border-color: var(--primary-hover-line);
        box-shadow: 0 10px 26px rgba(var(--primary-rgb), 0.16);
        transform: translateY(-50%) translateX(2px);
      }

      .sidebar-rail:hover svg {
        transform: translateY(-50%) translateX(2px);
      }

      .sidebar-rail:focus-visible {
        outline: none;
      }

      .sidebar:hover .sidebar-rail,
      .sidebar:focus-within .sidebar-rail {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 160ms ease, visibility 0s linear 160ms;
      }

      .sidebar-panel {
        display: flex;
        flex-direction: column;
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 2;
        width: 340px;
        min-width: 340px;
        height: 100%;
        overflow: hidden;
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(-14px) scale(0.99);
        transform-origin: left center;
        transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 220ms;
      }

      .sidebar:hover .sidebar-panel,
      .sidebar:focus-within .sidebar-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(0) scale(1);
        transition-delay: 0s;
      }

      .sidebar:focus-within .sidebar-panel {
        box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.24), var(--shadow-lg);
      }

      .app-shell.panels-pinned .body {
        gap: 14px;
      }

      .app-shell.panels-pinned .sidebar {
        position: relative;
        inset: auto;
        flex: 0 0 340px;
        width: 340px;
      }

      .app-shell.panels-pinned .sidebar-panel {
        position: relative;
        inset: auto;
        width: 100%;
        min-width: 0;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--line);
      }

      .sidebar-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .sidebar-head p {
        margin: 2px 0 0;
        color: var(--faint);
        font-size: 12px;
      }

      .sidebar-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px;
      }

      .connect-form {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 42px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.16);
      }

      .field input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      .file-picker {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .file-name {
        overflow: hidden;
        color: var(--faint);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field-hint {
        color: var(--faint);
        font-size: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 110px;
        gap: 10px;
      }

      .status-panel {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 44px;
        margin-top: 4px;
        padding: 10px 12px;
        color: var(--muted);
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        font-size: 13px;
        white-space: pre-line;
      }

      .ssh-config-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }

      .ssh-config-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .ssh-config-head h3 {
        margin: 0;
        font-size: 14px;
      }

      .ssh-config-list {
        display: grid;
        flex: 1;
        gap: 8px;
        min-height: 0;
        align-content: start;
        overflow: auto;
      }

      .ssh-config-bulk {
        display: flex;
        min-height: 38px;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 8px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }

      .ssh-select-all,
      .ssh-host-select {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 9px;
        cursor: pointer;
      }

      .ssh-select-all {
        min-height: 32px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .ssh-config-panel input[type="checkbox"] {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--primary);
      }

      .ssh-host {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        padding: 10px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .ssh-host.is-selected {
        background: var(--selected-bg);
        border-color: var(--selected-line);
      }

      .ssh-host-copy {
        min-width: 0;
      }

      .ssh-host-check {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 6px;
        cursor: pointer;
      }

      .ssh-host-check:focus-within {
        box-shadow: 0 0 0 3px var(--ring);
      }

      .ssh-host-name {
        overflow: hidden;
        font-weight: 700;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ssh-host-meta {
        overflow: hidden;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ssh-config-empty {
        padding: 10px 12px;
        color: var(--faint);
        background: var(--panel-soft);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius-sm);

      }

      }

      .settings-section h3 {
        margin: 0;

        font-size: 17px;

      .settings-section h3 {

      }

        background: var(--panel-solid);
        border: 1px solid var(--line-strong);

      .file-upload-head h2 {

      .file-upload-body h3 {

      .file-upload-body {

        font-size: 14px;
        text-overflow: ellipsis;

      .upload-file-summary span {

        font-family: var(--mono);
        font-size: 12px;
      }

      .upload-target-heading {

      .upload-target-list {

      .upload-target-copy strong {

        white-space: nowrap;
      }

      .upload-target-copy span,
      .upload-path-field > span,
      .upload-target-status {

      .upload-path-field input {
        width: 100%;
        min-width: 0;
        min-height: 38px;
        padding: 7px 10px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        font-family: var(--mono);
        font-size: 12px;
      }

      .upload-path-field input:focus {

      .upload-progress {

      .upload-progress-bar {

        background: var(--primary);

      }

      .file-upload-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }

      .overwrite-upload {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 13px;
        cursor: pointer;
      }

      .overwrite-upload input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: var(--primary);

      }

      .overwrite-upload input:disabled {

      .host-manager-overlay {
        position: fixed;
        inset: 0;
        z-index: 55;
        display: none;
        padding: 24px;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.64);
        backdrop-filter: blur(3px);
      }

      .host-manager-overlay.is-open {
        display: flex;
      }

      .host-manager-dialog {
        display: flex;
        flex-direction: column;
        width: min(1120px, 100%);
        height: min(760px, calc(100dvh - 48px));
        min-height: 420px;
        overflow: hidden;
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
      }

      .host-manager-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .host-manager-head h2 {
        margin: 0;
        font-size: 17px;
      }

      .host-manager-group {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .host-manager-group-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .host-manager-group-list {
        display: flex;
        gap: 6px;
        min-width: 0;
        padding: 2px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .host-manager-group-item {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .host-manager-group-item:hover {
        border-color: var(--line-strong);
      }

      .host-manager-group-item.is-active {
        background: var(--primary-tint);
        border-color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary-tint);
      }

      .host-manager-group-delete {
        min-height: 34px;
        color: inherit;
        background: transparent;
        border: 0;
      }

      .host-manager-group-tab {
        max-width: 180px;
        padding: 6px 10px;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .host-manager-group-delete {
        display: grid;
        width: 32px;
        padding: 0;
        place-items: center;
        color: var(--faint);
        border-left: 1px solid var(--line);
        transition: color 160ms ease, background 160ms ease;
      }

      .host-manager-group-delete:hover:not(:disabled) {
        color: var(--on-danger);
        background: var(--danger);
      }

      .host-manager-group-delete:disabled {
        cursor: not-allowed;
        opacity: 0.35;
      }

      .host-manager-panes {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }

      .host-manager-pane {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        min-height: 0;
        padding: 16px;
      }

      .host-manager-pane + .host-manager-pane {
        border-left: 1px solid var(--line);
      }

      .host-manager-pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 38px;
      }

      .host-manager-pane-head h3 {
        margin: 0;
        font-size: 14px;
      }

      .host-manager-count {
        color: var(--faint);
        font-size: 12px;
        font-weight: 700;
      }

      .host-session-list {
        display: grid;
        gap: 8px;
        align-content: start;
        min-height: 0;
        overflow: auto;
      }

      .host-session {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 11px 12px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }

      .host-session-dot {
        width: 9px;
        height: 9px;
        background: var(--faint);
        border-radius: 999px;
      }

      .host-session.is-connected .host-session-dot {
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-tint);
      }

      .host-session.is-error .host-session-dot {
        background: var(--danger);
      }

      .host-session-name,
      .host-session-meta {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .host-session-name {
        font-size: 13px;
        font-weight: 700;
      }

      .host-session-meta {
        color: var(--faint);
        font-family: var(--mono);
        font-size: 11px;
      }

      .status-panel svg {
        flex: 0 0 auto;
        margin-top: 2px;
        color: var(--faint);
      }

      /* ---------- Board ---------- */
      .board-wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        gap: 0;
      }

      .board {
        display: grid;
        grid-template-columns: none;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        grid-auto-columns: calc(50% - 7px);
        grid-auto-flow: column;
        flex: 1;
        gap: 14px;
        min-height: 0;
        padding-bottom: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-behavior: smooth;
        scroll-snap-type: x mandatory;
      }

      .board.no-smooth {
        scroll-behavior: auto;
        scroll-snap-type: none;
      }

      .group {
        display: flex;
        flex-direction: column;
        width: auto;
        height: 100%;
        min-width: 0;
        min-height: 0;
        max-width: none;
        align-self: stretch;
        background: var(--group-bg);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        position: relative;
        transition: box-shadow 180ms ease, border-color 180ms ease, transform 120ms ease;
      }

      .group-placeholder {
        height: 100%;
        min-height: 0;
        background: rgba(var(--primary-rgb), 0.08);
        border: 2px dashed var(--primary);
        border-radius: var(--radius);
      }

      .group.is-empty {
        min-height: 0;
      }

      .board > .group:nth-child(3n + 1),
      .board > .group:nth-child(3n + 2) {
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      .group.drag-over {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.16), var(--shadow-md);
      }

      .group.is-floating {
        opacity: 0.96;
        box-shadow: var(--shadow-lg);
        pointer-events: none;
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--line);
      }

      .group-grip {
        display: grid;
        flex: 0 0 auto;
        width: 26px;
        height: 34px;
        place-items: center;
        color: var(--line-strong);
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: grab;
        touch-action: none;
      }

      .group-grip:hover {
        color: var(--muted);
        background: var(--panel-soft);
      }

      .group-grip:active {
        cursor: grabbing;
      }

      .group-title {
        flex: 1;
        min-width: 0;
      }

      .group-name {
        display: inline-block;
        max-width: 100%;
        margin: 0;
        padding: 2px 6px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        border-radius: 6px;
        border: 1px solid transparent;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
      }

      .group-name:hover {
        background: var(--panel-soft);
      }

      .group-name:focus {
        outline: none;
        background: var(--panel-solid);
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.16);
        cursor: text;
      }

      .group-meta {
        display: block;
        margin-top: 1px;
        padding-left: 6px;
        color: var(--faint);
        font-size: 12px;
      }

      .group-tools {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      .group-tools button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        color: var(--faint);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      }

      .group-tools button:hover {
        color: var(--primary-strong);
        background: var(--primary-tint);
        border-color: var(--primary-hover-line);
      }

      .group-tools button.is-active {
        color: var(--primary-strong);
        background: var(--primary-tint);
        border-color: var(--primary);
      }

      .group-tools .broadcast-scope-toggle {
        display: grid;
        flex: 0 0 auto;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 112px;
        height: 32px;
        padding: 3px;
        gap: 2px;
        background: var(--segment-bg);
        border: 1px solid var(--segment-line);
        border-radius: 9px;
      }

      .group-tools .broadcast-scope-option {
        display: block;
        width: auto;
        height: 24px;
        padding: 0 7px;
        color: var(--segment-ink);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        transition: background 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .group-tools .broadcast-scope-option:hover {
        color: var(--segment-hover-ink);
        background: var(--segment-hover-bg);
        border-color: transparent;
      }

      .group-tools .broadcast-scope-option.is-active,
      .group-tools .broadcast-scope-option.is-active:hover {
        color: var(--segment-active-ink);
        background: var(--segment-active-bg);
        border-color: var(--segment-active-line);
        box-shadow: var(--segment-shadow);
      }

      .group-resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 2;
        width: 22px;
        height: 22px;
        cursor: ew-resize;
        touch-action: none;
      }

      .group-resize-handle::after {
        content: "";
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 3px;
        height: 12px;
        background: var(--line-strong);
        border-radius: 999px;
      }

      .group-tools button.danger-hover:hover {
        color: var(--danger);
        background: var(--danger-tint);
        border-color: var(--danger-line);
      }

      .broadcast {
        display: grid;
        position: relative;
        z-index: 3;
        grid-template-columns: minmax(0, 1fr) 112px 40px auto;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      .broadcast-input-wrap {
        position: relative;
        min-width: 0;
      }

      .broadcast-input-wrap > textarea {
        width: 100%;
      }

      .broadcast-history {
        position: absolute;
        inset: calc(100% + 6px) 0 auto;
        z-index: 6;
        max-height: 240px;
        padding: 4px;
        overflow-y: auto;
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        scrollbar-width: thin;
      }

      .broadcast-history[hidden] {
        display: none;
      }

      .broadcast-history.is-portal {
        position: fixed;
        inset: auto;
        z-index: 61;
      }

      .broadcast-history.is-history-mode {
        border-color: var(--accent);
      }

      .broadcast-history-option {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        overflow: hidden;
        color: var(--ink-soft);
        background: transparent;
        border: 0;
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 12px;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
      }

      .broadcast-history-command {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .broadcast-history-source {
        color: var(--muted);
        font-family: var(--sans);
        font-size: 10px;
        font-weight: 700;
      }

      .broadcast-history-option:hover,
      .broadcast-history-option.is-active {
        color: var(--ink);
        background: var(--primary-tint);
      }

      .broadcast textarea,
      .broadcast select {
        min-height: 40px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        font-family: var(--mono);
        font-size: 13px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .broadcast textarea {
        height: 40px;
        max-height: 106px;
        overflow: hidden;
        line-height: 22px;
        resize: none;
      }

      .broadcast textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
      }

      .broadcast select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
      }

      .terminal-list {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 12px;
        min-height: 0;
        padding: 12px;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .empty-state {
        display: grid;
        min-height: 150px;
        place-items: center;
        padding: 18px;
        color: var(--faint);
        background: var(--empty-bg);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius-sm);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        color: var(--ink-soft);
        font-size: 14px;
      }

      .empty-state span {
        display: block;
        margin-top: 4px;
        font-size: 12px;
      }

      /* ---------- Terminal card ---------- */
      .terminal-card {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        overflow: hidden;
        background: var(--terminal);
        border: 1px solid var(--terminal-line);
        border-radius: var(--radius-sm);
        box-shadow: 0 10px 26px rgba(2, 6, 23, 0.2);
        transition: box-shadow 180ms ease, border-color 180ms ease;
      }

      .terminal-card.dragging {
        opacity: 0.55;
        box-shadow: var(--shadow-lg);
      }

      .terminal-card.is-broadcast-selected {
        border-color: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.24), 0 10px 26px rgba(2, 6, 23, 0.2);
      }

      .card-placeholder {
        flex: 0 0 auto;
        height: 120px;
        border: 2px dashed var(--primary);
        border-radius: var(--radius-sm);
        background: rgba(var(--primary-rgb), 0.08);
      }

      .terminal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
        padding: 9px 12px;
        color: var(--terminal-ink);
        background: var(--terminal-head);
        border-bottom: 1px solid var(--terminal-line);
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .terminal-header:active {
        cursor: grabbing;
      }

      .terminal-identity {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .status-dot {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        background: #94a3b8;
        border-radius: 999px;
        transition: background 200ms ease, box-shadow 200ms ease;
      }

      .terminal-card.is-connecting .status-dot {
        background: var(--warn);
        box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.2);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .terminal-card.is-connected .status-dot {
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.24);
      }

      .terminal-card.is-error .status-dot {
        background: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.22);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .terminal-name {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        padding: 1px 4px;
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.2;
        border: 1px solid transparent;
        border-radius: 5px;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
      }

      .terminal-name:hover {
        background: #172033;
      }

      .terminal-name:focus {
        outline: none;
        color: #ffffff;
        background: #111827;
        border-color: #475569;
      }

      .terminal-meta {
        overflow: hidden;
        color: #94a3b8;
        font-family: var(--mono);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .terminal-network[data-latency="good"] {
        color: #86efac;
      }

      .terminal-network[data-latency="fair"],
      .terminal-network[data-latency="connecting"] {
        color: #fde68a;
      }

      .terminal-network[data-latency="poor"],
      .terminal-network[data-latency="offline"] {
        color: #fca5a5;
      }

      .terminal-tools {
        display: flex;
        flex: 0 0 auto;
        gap: 5px;
      }

      .terminal-tools button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        color: #cbd5e1;
        background: #0f172a;
        border: 1px solid #263244;
        border-radius: 8px;
        transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      }

      .terminal-tools button:hover {
        color: #ffffff;
        background: #1e293b;
        border-color: #475569;
      }

      .terminal-tools button.broadcast-select-terminal.is-active {
        color: #dcfce7;
        background: #166534;
        border-color: #22c55e;
      }

      .terminal-tools button:disabled {
        cursor: not-allowed;
        opacity: 0.38;
      }

      .terminal-tools button.close-btn:hover {
        color: #ffffff;
        background: var(--danger);
        border-color: var(--danger);
      }

      .host-session-tools button {
        color: var(--muted);
        background: var(--panel-solid);
        border-color: var(--line-strong);
      }

      .host-session-tools button:hover {
        color: var(--primary);
        background: var(--primary-tint);
        border-color: var(--primary);
      }

      .host-session-tools button.close-btn:hover {
        color: var(--on-danger);
        background: var(--danger);
        border-color: var(--danger);
      }

      .terminal-body {
        position: relative;
        height: 300px;
        padding: 4px 10px var(--terminal-bottom-space, 6.5px);
        overflow: hidden;
      }

      .terminal-body .terminal,
      .terminal-body .xterm {
        height: 100%;
      }

      .terminal-body .xterm-viewport {
        overflow-x: hidden;
        scrollbar-color: #475569 transparent;
        scrollbar-width: thin;
      }

      .terminal-body .xterm-viewport::-webkit-scrollbar {
        width: 8px;
      }

      .terminal-body .xterm-viewport::-webkit-scrollbar-track {
        background: transparent;
      }

      .terminal-body .xterm-viewport::-webkit-scrollbar-thumb {
        background: #475569;
        border: 2px solid #0a0f1f;
        border-radius: 8px;
      }

      .terminal-body .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      .terminal-placeholder {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        background: #070b16;
        border: 1px dashed #263244;
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 13px;
        white-space: pre-wrap;
        text-align: left;
      }

      .resize-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 12px;
        color: #334155;
        background: var(--terminal-head);
        border-top: 1px solid var(--terminal-line);
        cursor: ns-resize;
        touch-action: none;
      }

      .resize-handle::after {
        content: "";
        width: 36px;
        height: 3px;
        background: #334155;
        border-radius: 999px;
      }

      /* ---------- Maximized card ---------- */
      .terminal-card.maximized {
        position: fixed;
        inset: 14px;
        z-index: 50;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
      }

      .terminal-card.maximized .terminal-body {
        flex: 1;
        height: auto;
      }

      .terminal-card.maximized .resize-handle {
        display: none;
      }

      .terminal-header .terminal-name .badge {
        display: none;
      }

      .app-shell.group-fullscreen {
        padding: 8px;
      }

      .app-shell.group-fullscreen .topbar,
      .app-shell.group-fullscreen .sidebar {
        display: none;
      }

      .app-shell.group-fullscreen .body,
      .app-shell.group-fullscreen .board-wrap {
        min-height: 0;
        height: 100%;
      }

      .app-shell.group-fullscreen .board {
        display: flex;
        overflow: hidden;
        padding: 0;
      }

      .app-shell.group-fullscreen .group {
        display: none;
      }

      .app-shell.group-fullscreen .group.is-focused {
        display: flex;
        flex: 1 1 100%;
        width: 100%;
        background: var(--group-fullscreen-bg);
      }

      .app-shell.group-fullscreen .group.is-focused .terminal-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
        align-content: start;
        overflow: auto;
      }

      .app-shell.group-fullscreen .group.is-focused .terminal-card {
        min-height: 360px;
      }

      .app-shell.group-fullscreen .group.is-focused .terminal-body {
        height: min(52vh, 460px) !important;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 49;
        background: rgba(2, 6, 23, 0.5);
        backdrop-filter: blur(2px);
      }

      /* ---------- Toast ---------- */
      .toast-stack {
        position: fixed;
        bottom: 18px;
        left: 50%;
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 90vw;
        padding: 10px 16px;
        color: #ffffff;
        background: #0f172a;
        border-radius: 999px;
        box-shadow: var(--shadow-md);
        font-size: 13.5px;
        animation: toast-in 200ms ease;
      }

      .toast.success { background: var(--accent-strong); }
      .toast.error { background: var(--danger); }

      @keyframes toast-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .hide {
        display: none !important;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 900px) {
        .topbar-panel {
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar-panel > .top-actions {
          width: 100%;
          justify-content: flex-start;
        }

        .sidebar {
          width: 52px;
        }

        .sidebar-panel {
          width: min(340px, calc(100vw - 20px));
          min-width: min(340px, calc(100vw - 20px));
        }

        .ssh-config-head {
          align-items: flex-start;
        }

        .ssh-config-head .top-actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }

        .ssh-config-panel .btn-sm,
        .ssh-select-all,
        .ssh-host-check {
          min-height: 44px;
        }

        .ssh-host-check {
          width: 44px;
        }

        .host-manager-overlay {
          padding: 10px;
        }

        .settings-overlay {
          padding: 10px;
        }

        .reauth-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .file-upload-overlay {
          padding: 10px;
        }

        .file-upload-dialog {
          max-height: calc(100dvh - 20px);
        }

        .upload-target-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
        }

        .upload-path-field input {
          min-height: 44px;
        }

        .file-upload-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .file-upload-footer .top-actions {
          width: 100%;
          justify-content: flex-end;
        }

        .broadcast-upload {
          width: 44px;
          height: 44px;
        }

        .broadcast-history-option {
          min-height: 44px;
        }

        .settings-dialog {
          max-height: calc(100dvh - 20px);
        }

        .settings-body {
          grid-template-columns: minmax(0, 1fr);
        }

        .settings-section + .settings-section {
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .shortcut-row {
          grid-template-columns: minmax(0, 1fr) minmax(126px, 160px) 44px;
        }

        .shortcut-input,
        .shortcut-clear {
          min-height: 44px;
        }

        .shortcut-clear {
          width: 44px;
          height: 44px;
        }

        .host-manager-dialog {
          height: calc(100dvh - 20px);
        }

        .host-manager-head {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
          gap: 12px;
        }

        .host-manager-group {
          grid-column: 1 / -1;
          grid-row: 2;
          width: 100%;
        }

        .host-manager-group-list {
          width: 100%;
        }

        .host-manager-group-tab,
        .host-manager-group-delete,
        .host-session-tools button {
          min-height: 44px;
        }

        .host-manager-group-delete,
        .host-session-tools button {
          width: 44px;
        }

        .host-manager-panes {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(260px, 1fr) minmax(180px, 0.7fr);
        }

        .host-manager-pane + .host-manager-pane {
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .board {
          grid-auto-columns: 100%;
        }

        .group {
          width: auto;
          grid-column-end: span 1 !important;
        }

        .broadcast {
          grid-template-columns: minmax(0, 1fr);
        }

        .app-shell.group-fullscreen .group.is-focused .terminal-list {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 640px) {
        .app-shell.panels-pinned .body {
          flex-direction: column;
          gap: 10px;
        }

        .app-shell.panels-pinned .sidebar {
          flex: 0 0 min(340px, 42dvh);
          width: 100%;
          min-height: 0;
        }

        .app-shell.panels-pinned .sidebar-panel {
          width: 100%;
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#board" data-i18n="skipTerminals">跳到终端列表</a>
    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <button class="topbar-rail" type="button" data-i18n-title="openToolbar" data-i18n-aria-label="openToolbar" title="展开工具栏" aria-label="展开工具栏">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9h12M6 15h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="topbar-panel">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="m5 8 4 4-4 4M13 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div>
              <h1 data-i18n="appTitle">TermFleet-SSH</h1>
              <p><span class="live-dot" aria-hidden="true"></span><span id="fleet-summary">已连接 0 个 · 0 个分组</span></p>
            </div>
          </div>
          <div class="top-actions">
            <button class="btn btn-icon btn-theme" type="button" id="theme-toggle" aria-pressed="false" aria-label="切换到夜间主题" title="切换到夜间主题">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="btn btn-lang" type="button" id="language-toggle" aria-label="切换语言" title="切换语言" data-i18n-title="toggleLanguage" data-i18n-aria-label="toggleLanguage">EN</button>
            <button class="btn" type="button" id="open-host-manager" aria-keyshortcuts="Control+Shift+H Meta+Shift+H" data-i18n-title="hostManager" data-i18n-aria-label="hostManager" title="主机管理" aria-label="主机管理">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="16" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
                <rect x="4" y="14" width="16" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M8 7h.01M8 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span data-i18n="hosts">主机</span>
            </button>
            <button class="btn" type="button" id="open-system-settings" data-i18n-title="systemSettings" data-i18n-aria-label="systemSettings" title="系统设置" aria-label="系统设置">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h7M15 7h5M11 4v6M4 17h4M12 17h8M8 14v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span data-i18n="systemSettings">系统设置</span>
            </button>
            <button class="btn btn-compact" type="button" id="open-log" data-i18n="operationLog" data-i18n-title="operationLog" data-i18n-aria-label="operationLog">日志</button>
            <button class="btn" type="button" id="open-local-terminal">
              <span data-i18n="localTerminal">本机终端</span>
            </button>
            <button class="btn" type="button" id="add-group">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span data-i18n="newGroup">新建分组</span>
            </button>
            <button class="btn btn-danger" type="button" id="disconnect-all">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M18.36 6.64A9 9 0 1 1 5.64 6.64M12 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span data-i18n="disconnectAll">全部断开</span>
            </button>
          </div>
        </div>
      </header>

      <div class="body">
        <aside class="sidebar" aria-labelledby="connect-title">
          <button class="sidebar-rail" type="button" aria-label="连接服务器" title="连接服务器" data-i18n-title="connectServer" data-i18n-aria-label="connectServer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="sidebar-panel">
            <div class="sidebar-head">
              <div>
                <h2 id="connect-title" data-i18n="connectServer">连接服务器</h2>
                <p data-i18n="openSession">打开新的 SSH 会话</p>
              </div>
            </div>
            <div class="sidebar-scroll">
              <form id="connect" class="connect-form" action="" method="post" enctype="multipart/form-data"{% if debug %} novalidate{% end %}>
              <div class="field">
                <label for="hostname" data-i18n="hostname">主机名</label>
                <input type="text" id="hostname" name="hostname" autocomplete="off" placeholder="10.0.0.12 或 host.internal" data-i18n-placeholder="hostnamePlaceholder" required>
              </div>
              <div class="split">
                <div class="field">
                  <label for="username" data-i18n="username">用户名</label>
                  <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                  <label for="port" data-i18n="port">端口</label>
                  <input type="number" inputmode="numeric" id="port" name="port" placeholder="22" min="1" max="65535">
                </div>
              </div>
              <div class="field">
                <label for="password" data-i18n="password">密码</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
              </div>
              <div class="field">
                <label for="privatekey" data-i18n="privateKey">私钥</label>
                <div class="file-picker">
                  <label class="btn btn-sm" for="privatekey" data-i18n="chooseFile">选择文件</label>
                  <span class="file-name" id="privatekey-name" data-i18n="noFileChosen">未选择文件</span>
                  <input type="file" id="privatekey" name="privatekey">
                </div>
              </div>
              <div class="split">
                <div class="field">
                  <label for="passphrase" data-i18n="passphrase">私钥口令</label>
                  <input type="password" id="passphrase" name="passphrase">
                </div>
                <div class="field">
                  <label for="totp">TOTP</label>
                  <input type="password" inputmode="numeric" id="totp" name="totp">
                </div>
              </div>
              <div class="field">
                <label for="target-group" data-i18n="addToGroup">加入分组</label>
                <select id="target-group" name="target_group"></select>
              </div>
              <input type="hidden" id="term" name="term" value="xterm-256color">
              <input type="hidden" id="ssh-config-host" name="ssh_config_host" value="">
              {% module xsrf_form_html() %}
              <button type="submit" class="btn btn-primary" id="connect-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span data-i18n="connect">连接</span>
              </button>
              </form>
              <section class="log-panel" aria-labelledby="operation-log-title">
              <div class="panel-title-row">
                <h3 id="operation-log-title" data-i18n="operationLog">操作日志</h3>
                <button class="btn btn-sm" type="button" id="clear-log" data-i18n="clearLog">清空</button>
              </div>
              <div class="log-list" id="operation-log"></div>
              </section>
              <div id="status" class="status-panel" role="status" aria-live="polite">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 8v5M12 16h.01M12 3l9 16H3l9-16Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span id="status-text">就绪。填写表单后即可连接。</span>
              </div>
            </div>
          </div>
        </aside>

        <div class="board-wrap">
          <section class="board" id="board" aria-label="服务器分组" data-i18n-aria-label="serverGroups"></section>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
    <input type="file" id="file-upload-picker" hidden>
    <div class="settings-overlay connection-overlay" id="connection-overlay" aria-labelledby="connection-title" aria-modal="true" aria-hidden="true" role="dialog">
      <section class="settings-dialog connection-dialog">
        <header class="settings-head">
          <h2 id="connection-title" data-i18n="connectServer">连接服务器</h2>
          <button class="btn btn-icon" type="button" id="close-connection" data-i18n-title="close" data-i18n-aria-label="close" title="关闭" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="connection-dialog-body" id="connection-dialog-body"></div>
      </section>
    </div>
    <div class="file-upload-overlay" id="file-upload-overlay" aria-labelledby="file-upload-title" aria-modal="true" aria-hidden="true" role="dialog">
      <section class="file-upload-dialog">
        <header class="file-upload-head">
          <h2 id="file-upload-title" data-i18n="fileUpload">文件上传</h2>
          <button class="btn btn-icon" type="button" id="close-file-upload" data-i18n-title="close" data-i18n-aria-label="close" title="关闭" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="file-upload-body">
          <div class="upload-file-summary">
            <div>
              <span data-i18n="uploadFileName">文件</span>
              <strong id="file-upload-name"></strong>
            </div>
            <div>
              <span data-i18n="uploadFileSize">大小</span>
              <strong id="file-upload-size"></strong>
            </div>
          </div>
          <h3 class="upload-target-heading" data-i18n="uploadTargets">上传目标</h3>
          <div class="upload-target-list" id="file-upload-targets" aria-live="polite"></div>
        </div>
        <footer class="file-upload-footer">
          <label class="overwrite-upload">
            <input type="checkbox" id="overwrite-upload">
            <span data-i18n="overwriteExisting">覆盖同名文件</span>
          </label>
          <div class="top-actions">
            <button class="btn btn-sm" type="button" id="cancel-file-upload" data-i18n="cancel">取消</button>
            <button class="btn btn-primary btn-sm" type="button" id="start-file-upload" data-i18n="startUpload">开始上传</button>
          </div>
        </footer>
      </section>
    </div>
    <div class="settings-overlay" id="system-settings-overlay" aria-labelledby="system-settings-title" aria-modal="true" aria-hidden="true" role="dialog">
      <section class="settings-dialog">
        <header class="settings-head">
          <h2 id="system-settings-title" data-i18n="systemSettings">系统设置</h2>
          <button class="btn btn-icon" type="button" id="close-system-settings" data-i18n-title="close" data-i18n-aria-label="close" title="关闭" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="settings-body">
          <section class="settings-section" aria-labelledby="terminal-settings-title">
            <h3 id="terminal-settings-title" data-i18n="terminalSettings">终端与连接</h3>
            <label class="setting-row" for="setting-confirm-disconnect">
              <span data-i18n="confirmDisconnect">断开全部前确认</span>
              <input type="checkbox" id="setting-confirm-disconnect" checked>
            </label>
            <label class="setting-row" for="setting-broadcast-enter">
              <span data-i18n="broadcastEnter">广播命令自动回车</span>
              <input type="checkbox" id="setting-broadcast-enter" checked>
            </label>
            <label class="setting-row" for="setting-font-size">
              <span data-i18n="terminalFontSize">终端字号</span>
              <input type="number" id="setting-font-size" min="10" max="24" value="13">
            </label>
            <label class="setting-row" for="setting-terminal-height">
              <span data-i18n="terminalHeight">终端默认高度</span>
              <input type="number" id="setting-terminal-height" min="180" max="720" value="300">
            </label>
            <label class="setting-row" for="setting-max-terminals">
              <span data-i18n="maxTerminals">最多终端数</span>
              <input type="number" id="setting-max-terminals" min="1" max="500" value="20">
            </label>
            <label class="setting-row" for="setting-max-upload">
              <span data-i18n="maxUploadSize">单文件上传上限（MiB）</span>
              <input type="number" id="setting-max-upload" min="1" max="10240" value="100">
            </label>
            <label class="setting-row" for="setting-connection-concurrency">
              <span data-i18n="connectionConcurrency">SSH 建连并发数</span>
              <input type="number" id="setting-connection-concurrency" min="1" max="128" value="32">
            </label>
          </section>
          <section class="settings-section" aria-labelledby="keyboard-shortcuts-title">
            <div class="settings-section-head">
              <h3 id="keyboard-shortcuts-title" data-i18n="keyboardShortcuts">快捷键</h3>
              <button class="btn btn-sm" type="button" id="reset-shortcuts" data-i18n="restoreDefaults">恢复默认</button>
            </div>
            <div class="shortcut-list" id="shortcut-settings-list"></div>
          </section>
        </div>
      </section>
    </div>
    <div class="settings-overlay reauth-overlay" id="reauth-overlay" aria-labelledby="reauth-title" aria-modal="true" aria-hidden="true" role="dialog">
      <section class="settings-dialog reauth-dialog">
        <header class="settings-head">
          <h2 id="reauth-title" data-i18n="reauthenticateSession">重新认证终端</h2>
          <button class="btn btn-icon" type="button" id="close-reauth" data-i18n-title="close" data-i18n-aria-label="close" title="关闭" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <form class="reauth-form" id="reauth-form" enctype="multipart/form-data">
          <div class="reauth-target">
            <strong id="reauth-target-name"></strong>
            <span id="reauth-target-meta"></span>
          </div>
          <div class="field">
            <label for="reauth-password" data-i18n="password">密码</label>
            <input type="password" id="reauth-password" name="password" autocomplete="current-password">
          </div>
          <div class="field">
            <label for="reauth-privatekey" data-i18n="privateKey">私钥</label>
            <div class="file-picker">
              <label class="btn btn-sm" for="reauth-privatekey" data-i18n="chooseFile">选择文件</label>
              <span class="file-name" id="reauth-privatekey-name" data-i18n="noFileChosen">未选择文件</span>
              <input type="file" id="reauth-privatekey" name="privatekey">
            </div>
          </div>
          <div class="reauth-grid">
            <div class="field">
              <label for="reauth-passphrase" data-i18n="passphrase">私钥口令</label>
              <input type="password" id="reauth-passphrase" name="passphrase">
            </div>
            <div class="field">
              <label for="reauth-totp">TOTP</label>
              <input type="password" inputmode="numeric" id="reauth-totp" name="totp">
            </div>
          </div>
          <div class="reauth-actions">
            <button class="btn btn-sm" type="button" id="cancel-reauth" data-i18n="cancel">取消</button>
            <button class="btn btn-primary btn-sm" type="submit" id="submit-reauth" data-i18n="reauthenticate">重新认证</button>
          </div>
        </form>
      </section>
    </div>
    <div class="host-manager-overlay" id="host-manager-overlay" aria-labelledby="host-manager-title" aria-modal="true" aria-hidden="true" role="dialog">
      <section class="host-manager-dialog">
        <header class="host-manager-head">
          <h2 id="host-manager-title" data-i18n="hostManager">主机管理</h2>
          <div class="host-manager-group">
            <span class="host-manager-group-label" id="host-manager-group-label" data-i18n="currentGroup">当前分组</span>
            <div class="host-manager-group-list" id="host-manager-groups" role="group" aria-labelledby="host-manager-group-label"></div>
            <button class="btn btn-icon" type="button" id="host-manager-add-group" data-i18n-title="newGroup" data-i18n-aria-label="newGroup" title="新建分组" aria-label="新建分组">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <button class="btn btn-icon" type="button" id="close-host-manager" data-i18n-title="close" data-i18n-aria-label="close" title="关闭" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="host-manager-panes">
          <section class="host-manager-pane ssh-config-panel" aria-labelledby="ssh-config-title">
            <div class="host-manager-pane-head ssh-config-head">
              <h3 id="ssh-config-title" data-i18n="recognizedHosts">已识别主机</h3>
              <button class="btn btn-sm" type="button" id="refresh-ssh-config" data-i18n="refreshHosts">刷新</button>
            </div>
            <div class="ssh-config-bulk">
              <label class="ssh-select-all" for="select-all-ssh-config">
                <input type="checkbox" id="select-all-ssh-config">
                <span data-i18n="selectAllHosts">全选</span>
              </label>
              <button class="btn btn-primary btn-sm" type="button" id="open-selected-ssh-config" disabled>
                <span id="open-selected-ssh-config-label">打开所选（0）</span>
              </button>
            </div>
            <div class="ssh-config-list" id="ssh-config-list" aria-live="polite"></div>
          </section>
          <section class="host-manager-pane" aria-labelledby="host-manager-open-title">
            <div class="host-manager-pane-head">
              <h3 id="host-manager-open-title" data-i18n="openedInGroup">分组内已打开</h3>
              <span class="host-manager-count" id="host-manager-open-count"></span>
            </div>
            <div class="host-session-list" id="host-manager-open-list" aria-live="polite"></div>
          </section>
        </div>
      </section>
    </div>
    <div class="log-overlay" id="log-overlay" aria-labelledby="log-overlay-title" aria-modal="true" role="dialog">
      <div class="log-overlay-head">
        <h2 id="log-overlay-title" data-i18n="operationLog">操作日志</h2>
        <div class="top-actions">
          <button class="btn btn-sm" type="button" id="clear-log-full" data-i18n="clearLog">清空</button>
          <button class="btn btn-sm" type="button" id="close-log" data-i18n="close">关闭</button>
        </div>
      </div>
      <pre class="log-output" id="log-output"></pre>
    </div>

    <script src="static/js/xterm.min.js"></script>
    <script src="static/js/xterm-addon-fit.min.js"></script>
    <script src="static/js/main.js"></script>
  </body>
</html>
